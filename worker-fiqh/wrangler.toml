# Pelayan Tanya AI Fiqh SiswaCap (Cloudflare Workers)
# Menjawab soalan fiqh dengan Claude, hanya bersandarkan rujukan yang boleh dibuka dan disemak.
name = "bijak-labur-fiqh"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Domain tetap yang digunakan oleh laman dan app (zon bijaklabur.my dalam akaun Cloudflare yang sama).
routes = [{ pattern = "fiqh.bijaklabur.my", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://bijaklabur.my,https://www.bijaklabur.my,https://shamirai-rgb.github.io,capacitor://localhost,https://localhost"

# Had kadar percuma Cloudflare: 5 soalan seminit bagi setiap alamat IP, supaya kredit API tidak dihabiskan.
[[unsafe.bindings]]
name = "FIQH_LIMIT"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

# Semak Kertas: 3 semakan seminit bagi setiap alamat IP
[[unsafe.bindings]]
name = "SEMAK_LIMIT"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 3, period = 60 }

# Sihat: 6 analisis kalori seminit bagi setiap alamat IP
[[unsafe.bindings]]
name = "KALORI_LIMIT"
type = "ratelimit"
namespace_id = "2003"
simple = { limit = 6, period = 60 }

# Studio Gambar AI: 3 gambar seminit bagi setiap alamat IP
[[unsafe.bindings]]
name = "GAMBAR_LIMIT"
type = "ratelimit"
namespace_id = "2004"
simple = { limit = 3, period = 60 }

# Buku Nota AI: 6 permintaan seminit bagi setiap alamat IP
[[unsafe.bindings]]
name = "BUKU_LIMIT"
type = "ratelimit"
namespace_id = "2005"
simple = { limit = 6, period = 60 }

# Kerjaya AI: 6 permintaan seminit bagi setiap alamat IP
[[unsafe.bindings]]
name = "KERJA_LIMIT"
type = "ratelimit"
namespace_id = "2006"
simple = { limit = 6, period = 60 }

# No AI Slop: 4 semakan seminit bagi setiap alamat IP
[[unsafe.bindings]]
name = "MANUSIA_LIMIT"
type = "ratelimit"
namespace_id = "2007"
simple = { limit = 4, period = 60 }

# Semak Kertas, audit lanjutan (rubrik tesis, NC industri, carta alir, pelan lantai): 3 seminit bagi setiap alamat IP
[[unsafe.bindings]]
name = "AUDIT_LIMIT"
type = "ratelimit"
namespace_id = "2008"
simple = { limit = 3, period = 60 }

# AI Coach Akademi Pelaburan (Moomoo dan Kripto): 8 soalan seminit bagi setiap alamat IP
[[unsafe.bindings]]
name = "COACH_LIMIT"
type = "ratelimit"
namespace_id = "2009"
simple = { limit = 8, period = 60 }

# Workers AI: FLUX untuk Studio Gambar, dan Llama sebagai penghala sandaran apabila kuota Gemini habis. Peringkat percuma 10,000 neuron sehari; tiada caj pada pelan percuma.
[ai]
binding = "AI"

# Rujukan rasmi moden: teks setiap muka surat PDF dan indeks carian, dibina oleh scripts/muat-rujukan.mjs
# semasa pemasangan (tidak disimpan dalam repo). run_worker_first: teks tidak dihidangkan terus kepada umum.
[assets]
directory = "./aset"
binding = "RUJUKAN"
run_worker_first = true

# Rahsia (ditetapkan oleh GitHub Actions, jangan tulis di sini): ANTHROPIC_API_KEY (Claude) atau GEMINI_API_KEY (Gemini percuma)
# Pilihan: GEMINI_MODEL (lalai gemini-flash-lite-latest)
