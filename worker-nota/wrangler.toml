# Pelayan kedai nota IC220 Bijak Labur (Cloudflare Workers + Workers KV, pelan percuma)
name = "bijak-labur-nota"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Domain tetap yang digunakan oleh laman dan app (zon bijaklabur.my dalam akaun Cloudflare yang sama).
routes = [{ pattern = "nota.bijaklabur.my", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://bijaklabur.my,https://www.bijaklabur.my,https://shamirai-rgb.github.io,capacitor://localhost,https://localhost"
# Cincang SHA-256 kunci pemilik (bukan kunci itu sendiri). Kunci boleh ditukar dari ruang pemilik.
OWNER_KEY_HASH = "ba63c8003b26e061933c6529ee7e103940ec510c1aa7aa6438f5ecf2e221d4ef"

# Ruang nama KV "bijak-labur-nota" dicipta dan diikat oleh .github/workflows/nota.yml semasa dipasang.

# Ruang pemilik: 60 permintaan seminit bagi setiap alamat IP (mengehadkan cubaan meneka kunci)
[[unsafe.bindings]]
name = "ADMIN_LIMIT"
type = "ratelimit"
namespace_id = "3001"
simple = { limit = 60, period = 60 }

# Kiraan klik iklan: sekali seminit bagi setiap alamat IP dan ruang (lindungi kuota tulis KV)
[[unsafe.bindings]]
name = "KLIK_LIMIT"
type = "ratelimit"
namespace_id = "3002"
simple = { limit = 1, period = 60 }

# Harga saham (setiap permintaan membaca sehingga 8 harga Yahoo): 30 seminit bagi setiap alamat IP
[[unsafe.bindings]]
name = "SAHAM_LIMIT"
type = "ratelimit"
namespace_id = "3003"
simple = { limit = 30, period = 60 }
