# Pelayan jadual kelas UiTM Bijak Labur (Cloudflare Workers, pelan percuma)
# Membaca jadual awam iCress (simsweb4.uitm.edu.my) dan menghantarnya sebagai JSON dengan CORS.
name = "bijak-labur-jadual"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Domain tetap yang digunakan oleh laman dan app. Cloudflare mencipta rekod DNS ini sendiri
# apabila zon bijaklabur.my aktif dalam akaun yang sama.
routes = [{ pattern = "jadual.bijaklabur.my", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://bijaklabur.my,https://www.bijaklabur.my,https://shamirai-rgb.github.io,capacitor://localhost,https://localhost"

# Permintaan yang tiada dalam cache (setiap satu membaca iCress): 60 seminit bagi setiap alamat IP
[[unsafe.bindings]]
name = "JADUAL_LIMIT"
type = "ratelimit"
namespace_id = "4001"
simple = { limit = 60, period = 60 }

# Carian jadual mengikut No. Pelajar: 20 seminit bagi setiap alamat IP
[[unsafe.bindings]]
name = "PELAJAR_LIMIT"
type = "ratelimit"
namespace_id = "4002"
simple = { limit = 20, period = 60 }
