<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halaman tidak dijumpai · Bijak Labur</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { padding: 0; min-height: 100dvh; display: grid; place-items: center; }
    .nf { max-width: 420px; padding: 32px 20px 48px; }
    .nf-code { font-size: 4.5rem; font-weight: 650; letter-spacing: -0.05em; line-height: 1; color: var(--brand); font-feature-settings: "tnum" 1; }
    .nf h1 { margin: 14px 0 8px; font-size: 1.6rem; }
    .nf p { color: var(--muted); }
    .nf-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-code">404</div>
    <h1>Halaman ini tidak wujud</h1>
    <p>Pautan mungkin salah taip atau halaman telah dipindahkan. Semua alat Bijak Labur boleh dicapai dari halaman utama.</p>
    <div class="nf-links">
      <a class="btn" href="/#utama">Ke halaman utama</a>
      <a class="btn ghost" href="/#semak">Semak kertas kerja</a>
    </div>
  </main>
</body>
</html>
