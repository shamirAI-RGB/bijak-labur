# Pelayan pembayaran Premium SiswaCap (Cloudflare Workers, pelan percuma)
name = "bijak-labur-premium"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
SITE_URL = "https://siswacap.my/"
ALLOWED_ORIGINS = "https://siswacap.my,https://www.siswacap.my,https://bijaklabur.my,https://www.bijaklabur.my,https://shamirai-rgb.github.io,capacitor://localhost,https://localhost"
# Tukar ke https://dev.toyyibpay.com untuk ujian sandbox
TOYYIBPAY_BASE = "https://toyyibpay.com"
# Projek Firebase untuk log masuk (Tetapan projek > Umum). Kunci API web ini memang awam.
FIREBASE_PROJECT_ID = "bijak-labur"
FIREBASE_API_KEY = "AIzaSyDRwErMFQqREFjBqeztSLdUqCUJbgmlqGw"
# Berapa kali satu akaun boleh bertukar ke peranti baharu dalam 30 hari
MAX_DEVICE_SWITCHES = "3"
# 0 = FPX sahaja, 1 = kad sahaja, 2 = FPX dan kad
PAYMENT_CHANNEL = "2"

# Rahsia (ditetapkan oleh GitHub Actions, jangan tulis di sini):
# TOYYIBPAY_SECRET, TOYYIBPAY_CATEGORY, LICENSE_PRIVATE_JWK

# Akaun dan peranti aktif: satu Durable Object (SQLite, pelan percuma) bagi setiap akaun
[[durable_objects.bindings]]
name = "AKAUN"
class_name = "Akaun"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Akaun"]

# Komuniti: satu Durable Object (SQLite) untuk rakan, lokasi, sembang, acara, servis dan notifikasi
[[durable_objects.bindings]]
name = "KOMUNITI"
class_name = "Komuniti"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Komuniti"]

# Moderasi Komuniti mengesahkan kunci pemilik melalui pelayan nota (sumber tunggal kunci Mod Pemilik)
[[services]]
binding = "NOTA_SVC"
service = "bijak-labur-nota"

# Komuniti: 90 permintaan seminit bagi setiap akaun dan setiap alamat IP
[[unsafe.bindings]]
name = "KOMUNITI_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 90, period = 60 }

# Suara HD: 40 permintaan seminit bagi setiap alamat IP (yang sudah dicache tidak dikira)
[[unsafe.bindings]]
name = "TTS_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

# Cipta bil ToyyibPay: 5 seminit bagi setiap akaun
[[unsafe.bindings]]
name = "CHECKOUT_LIMIT"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 5, period = 60 }
