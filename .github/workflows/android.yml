name: Android

# Bina APK (untuk dicuba terus di telefon) dan AAB (untuk Google Play).
# AAB ditandatangani jika rahsia ANDROID_KEYSTORE_BASE64 dan kata laluannya telah ditetapkan.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Token GitHub hanya boleh membaca repo (prinsip keistimewaan minimum)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - run: npm ci
      - name: Muat turun data waktu solat sandaran
        run: npm run solat-data || echo "Data sandaran dilangkau"
      - run: npm run build
      - run: npx cap sync android

      - name: Sediakan kunci tandatangan
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Buang ruang dan baris baharu yang mungkin terikut semasa salin dan tampal
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks"; then
            echo "::error::Rahsia ANDROID_KEYSTORE_BASE64 rosak (bukan base64 yang sah). Tampal semula seluruh isi ANDROID_KEYSTORE_BASE64.txt."
            exit 1
          fi
          # Cap jari fail kunci yang betul bermula dengan a400d297cc80 (bukan rahsia)
          SUM=$(sha256sum "$RUNNER_TEMP/upload.jks" | cut -c1-12)
          echo "Cap jari kunci: $SUM"
          if [ "$SUM" != "a400d297cc80" ]; then
            echo "::error::Rahsia ANDROID_KEYSTORE_BASE64 tidak lengkap atau tersalah. Tampal semula seluruh isi ANDROID_KEYSTORE_BASE64.txt (2868 aksara)."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Semak kata laluan dan alias kunci
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          S=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d ' \r\n\t')
          A=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d ' \r\n\t')
          K=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d ' \r\n\t')
          echo "Panjang ANDROID_KEYSTORE_PASSWORD: ${#S} (sepatutnya 24)"
          echo "Panjang ANDROID_KEY_ALIAS: ${#A} (sepatutnya 10)"
          echo "Panjang ANDROID_KEY_PASSWORD: ${#K} (sepatutnya 24)"
          if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$S" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD salah. Salin semula teks selepas tanda = pada baris itu dalam BACA-SAYA.txt."
            exit 1
          fi
          if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$S" -alias "$A" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_ALIAS salah. Nilai yang betul ialah bijaklabur (huruf kecil)."
            exit 1
          fi
          if ! keytool -certreq -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$S" -alias "$A" -keypass "$K" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_PASSWORD salah. Salin semula teks selepas tanda = pada baris itu dalam BACA-SAYA.txt."
            exit 1
          fi
          echo "Kata laluan dan alias betul."

      - name: Bina APK dan AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bijak-labur-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Hantar ke Google Play (trek ujian dalaman)
        if: github.ref == 'refs/heads/main' && env.HAS_PLAY == 'true' && env.HAS_KEYSTORE == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.shamirairgb.bijaklabur
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
