name: Cari azan (sementara)
on:
  push:
    branches: [claude/azan-bunyi]
    paths: [.github/workflows/cari-azan.yml]
permissions:
  contents: write
jobs:
  ambil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Muat turun rakaman azan CC0 daripada Wikimedia Commons
        run: |
          mkdir -p tmp-azan
          curl -sSfL -A "BijakLabur/1.0 (bijaklabur.my)" -o tmp-azan/beautiful-adhan.ogg "https://upload.wikimedia.org/wikipedia/commons/b/b0/Beautiful_adhan.ogg"
          curl -sSfL -A "BijakLabur/1.0 (bijaklabur.my)" -o tmp-azan/adhan.ogg "https://upload.wikimedia.org/wikipedia/commons/e/e7/Adhan.ogg"
          ls -l tmp-azan
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add tmp-azan && git commit -m "Sementara: rakaman azan mentah" && git push
