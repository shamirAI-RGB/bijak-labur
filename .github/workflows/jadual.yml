name: Pelayan jadual UiTM

# Uji pelayan jadual kelas UiTM, dan pasang ke Cloudflare Workers apabila rahsia Cloudflare telah ditetapkan.
on:
  push:
    branches: [main]
    paths: ['worker-jadual/**', '.github/workflows/jadual.yml']
  pull_request:
    paths: ['worker-jadual/**', '.github/workflows/jadual.yml']
  workflow_dispatch:

# Token GitHub hanya boleh membaca repo (prinsip keistimewaan minimum)
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Uji
        run: node worker-jadual/test.mjs
      # Cuba dengan domain jadual.bijaklabur.my dahulu. Jika zon bijaklabur.my belum aktif di Cloudflare,
      # pasang ke alamat workers.dev sahaja supaya pelayan tetap hidup.
      - name: Pasang ke Cloudflare (domain jadual.bijaklabur.my)
        id: domain
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker-jadual
      - name: Pasang ke Cloudflare (workers.dev sahaja)
        id: devonly
        if: steps.domain.outcome == 'failure'
        run: sed -i '/^routes = /d' worker-jadual/wrangler.toml
      - if: steps.domain.outcome == 'failure'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker-jadual
      - name: Ringkasan
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "$HAS_CF" != "true" ]; then
            echo "Rahsia CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID belum ditetapkan, jadi pelayan jadual tidak dipasang." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.domain.outcome }}" = "success" ]; then
            echo "Pelayan jadual dipasang di https://jadual.bijaklabur.my" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Domain jadual.bijaklabur.my belum boleh digunakan (zon Cloudflare belum aktif?). Pelayan dipasang di alamat workers.dev; lihat log langkah di atas untuk URL." >> "$GITHUB_STEP_SUMMARY"
          fi
