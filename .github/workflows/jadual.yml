name: Pelayan jadual UiTM

# Uji pelayan jadual kelas UiTM, dan pasang ke Cloudflare Workers apabila rahsia Cloudflare telah ditetapkan.
on:
  push:
    branches: [main]
    paths: ['worker-jadual/**', '.github/workflows/jadual.yml']
  pull_request:
    paths: ['worker-jadual/**', '.github/workflows/jadual.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uji
        run: node worker-jadual/test.mjs
      - name: Pasang ke Cloudflare
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker-jadual
