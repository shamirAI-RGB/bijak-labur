# Beritahu Bing, Yandex, Seznam dan Naver (IndexNow) setiap kali halaman awam berubah.
# Bing juga menjadi sumber carian untuk ChatGPT dan Copilot.
name: IndexNow

on:
  push:
    branches: [main]
    paths: ['*.html', 'sitemap.xml', 'llms.txt', '.github/workflows/indexnow.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      HOST: siswacap.my
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Baca kunci IndexNow (kunci awam, fail <kunci>.txt di akar laman)
        run: echo "KEY=$(ls | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')" >> "$GITHUB_ENV"
      - name: Tunggu GitHub Pages siap
        run: |
          for i in $(seq 1 20); do
            if [ "$(curl -fsS "https://$HOST/$KEY.txt" || true)" = "$KEY" ]; then echo "Kunci sudah live"; exit 0; fi
            sleep 30
          done
          echo "Fail kunci belum live, langkau"; exit 1
      - name: Hantar URL ke IndexNow
        run: |
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<\/\?loc>//g' | jq -R . | jq -s .)
          BODY=$(jq -n --arg host "$HOST" --arg key "$KEY" --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: $urls}')
          echo "$BODY"
          CODE=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          cat /tmp/resp; echo; echo "HTTP $CODE"
          case "$CODE" in 200|202) ;; *) exit 1 ;; esac
