name: Pintu AI Agent (agen.bijaklabur.my)

# Uji dan pasang Worker agen.bijaklabur.my (pautan pemilik ke Pejabat AI Agent).
on:
  push:
    branches: [main]
    paths: ['worker-agen/**', '.github/workflows/agen.yml']
  pull_request:
    paths: ['worker-agen/**', '.github/workflows/agen.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-agen
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uji
        run: node test.mjs
      - name: Pasang ke Cloudflare (agen.bijaklabur.my)
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        run: npx --yes wrangler@3 deploy
