name: Pintu AI Agent (agen.bijaklabur.my)

# Uji dan pasang Worker yang melindungi Activepieces peribadi pemilik.
# Selepas menambah atau menukar rahsia AGEN_* / ACCESS_* dalam GitHub, jalankan semula aliran ini
# (Actions > Pintu AI Agent > Run workflow) supaya rahsia baharu dimuat naik ke Cloudflare.
on:
  push:
    branches: [main]
    paths: ['worker-agen/**', '.github/workflows/agen.yml']
  pull_request:
    paths: ['worker-agen/**', '.github/workflows/agen.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-agen
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uji
        run: node test.mjs
      # Tiada sandaran workers.dev: pintu ini hanya hidup di domain yang dilindungi Cloudflare Access.
      - name: Pasang ke Cloudflare (agen.bijaklabur.my)
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        run: npx --yes wrangler@3 deploy
      # Rahsia dimuat naik hanya jika ditetapkan. Tanpa kelima-limanya, Worker menolak semua permintaan.
      - name: Rahsia Space dan Cloudflare Access
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          SPACE_URL: ${{ secrets.AGEN_SPACE_URL }}
          HF_TOKEN: ${{ secrets.AGEN_HF_TOKEN }}
          ACCESS_TEAM: ${{ secrets.ACCESS_TEAM }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ALLOWED_EMAIL: ${{ secrets.ACCESS_EMAIL }}
        run: |
          missing=""
          for n in SPACE_URL HF_TOKEN ACCESS_TEAM ACCESS_AUD ALLOWED_EMAIL; do
            v="${!n}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx --yes wrangler@3 secret put "$n"; else missing="$missing $n"; fi
          done
          if [ -n "$missing" ]; then
            echo "Rahsia belum ditetapkan:$missing. Pintu agen.bijaklabur.my akan menolak semua permintaan sehingga semuanya ditetapkan." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pintu AI Agent dipasang di https://agen.bijaklabur.my" >> "$GITHUB_STEP_SUMMARY"
          fi
