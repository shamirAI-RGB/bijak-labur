name: Tinjau laman Mufti (sementara)

# Sementara (dibuang sebelum PR sedia): uji capaian dan struktur setiap laman Jabatan Mufti dari GitHub Actions
on:
  push:
    branches: [claude/fatwa-laman-mufti]
    paths: ['worker-fiqh/scripts/muat-mufti.mjs', 'worker-fiqh/scripts/tinjau-sementara.mjs', 'js/fiqh-data.js', '.github/workflows/mufti-tinjau.yml']

permissions:
  contents: read

jobs:
  tinjau:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-fiqh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Cache fatwa Mufti
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: worker-fiqh/.cache/mufti
          key: mufti-tinjau-v1-${{ github.run_id }}
          restore-keys: mufti-tinjau-v1-
      - name: Struktur halaman fatwa
        timeout-minutes: 5
        continue-on-error: true
        run: node scripts/tinjau-sementara.mjs
      - name: Muat fatwa laman Mufti
        timeout-minutes: 20
        env:
          MUFTI_MINIT: '12'
        run: node scripts/muat-mufti.mjs
      - name: Saiz cache
        if: always()
        run: ls -la .cache/mufti || true
