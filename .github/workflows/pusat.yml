name: Pusat Kawalan

# Uji Pusat Kawalan (pelawat langsung, token AI, agen Telegram) dan pasang ke Cloudflare Workers apabila rahsia Cloudflare ada.
on:
  push:
    branches: [main]
    paths: ['worker-pusat/**', '.github/workflows/pusat.yml']
  pull_request:
    paths: ['worker-pusat/**', '.github/workflows/pusat.yml']
  workflow_dispatch:

# Token GitHub hanya boleh membaca repo (prinsip keistimewaan minimum)
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-pusat
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker-pusat/package-lock.json
      - run: npm ci
      - name: Uji
        run: node test.mjs
      # Cuba dengan domain pusat.bijaklabur.my dahulu. Jika gagal, pasang ke alamat workers.dev sahaja.
      - name: Pasang ke Cloudflare (domain pusat.bijaklabur.my)
        id: domain
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        continue-on-error: true
        run: npx --yes wrangler@3 deploy
      - name: Pasang ke Cloudflare (workers.dev sahaja)
        if: steps.domain.outcome == 'failure'
        run: |
          sed -i '/^routes = /d' wrangler.toml
          npx --yes wrangler@3 deploy
      # Setiap rahsia dimuat naik hanya jika ia ditetapkan dalam GitHub Secrets.
      - name: Rahsia
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          PUSAT_SECRET: ${{ secrets.PUSAT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.AGEN_GITHUB_TOKEN }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for k in PUSAT_SECRET TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID ANTHROPIC_API_KEY GEMINI_API_KEY GH_TOKEN CF_ANALYTICS_TOKEN CF_ACCOUNT_ID; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx --yes wrangler@3 secret put "$k" >/dev/null && echo "$k dimuat naik"; fi
          done
      # Daftar webhook Telegram ke pelayan ini (rahsia webhook diterbitkan daripada token bot, sama seperti dalam src/telegram.js)
      - name: Pasang webhook Telegram
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true' && steps.domain.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN belum ditetapkan; agen Telegram tidak aktif."; exit 0; fi
          secret=$(printf '%s:webhook' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -d' ' -f1)
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" \
            -H 'content-type: application/json' \
            -d "{\"url\":\"https://pusat.bijaklabur.my/telegram\",\"secret_token\":\"$secret\",\"allowed_updates\":[\"message\"],\"max_connections\":10}" \
            | jq -r 'if .ok then "Webhook Telegram dipasang." else "Webhook gagal: \(.description)" end'
      - name: Ringkasan
        if: github.ref == 'refs/heads/main'
        env:
          HAS_TG: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
          HAS_SECRET: ${{ secrets.PUSAT_SECRET != '' }}
          HAS_AI: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.GEMINI_API_KEY != '' }}
        run: |
          {
            if [ "$HAS_CF" != "true" ]; then echo "Rahsia Cloudflare belum ditetapkan, jadi Pusat Kawalan tidak dipasang."; exit 0; fi
            if [ "${{ steps.domain.outcome }}" = "success" ]; then echo "Pusat Kawalan dipasang di https://pusat.bijaklabur.my (papan: https://siswacap.my/pusat.html)."; else echo "Domain pusat.bijaklabur.my belum boleh digunakan; dipasang ke alamat workers.dev (lihat log)."; fi
            [ "$HAS_SECRET" = "true" ] || echo "- PUSAT_SECRET belum ditetapkan: kiraan token AI daripada worker-fiqh tidak akan sampai."
            [ "$HAS_TG" = "true" ] || echo "- TELEGRAM_BOT_TOKEN belum ditetapkan: agen Telegram tidak aktif."
            [ "$HAS_AI" = "true" ] || echo "- ANTHROPIC_API_KEY / GEMINI_API_KEY belum ditetapkan: agen menjawab arahan pantas (/stat, /sihat, ...) sahaja."
          } >> "$GITHUB_STEP_SUMMARY"
