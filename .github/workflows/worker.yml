name: Pelayan pembayaran

# Uji pelayan pembayaran Premium, dan pasang ke Cloudflare Workers apabila rahsia telah ditetapkan.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

# Token GitHub hanya boleh membaca repo (prinsip keistimewaan minimum)
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Uji
        run: node worker/test.mjs
      # Pasang apabila token Cloudflare ada. Setiap rahsia dimuat naik hanya jika ia ditetapkan,
      # jadi Suara HD boleh dihidupkan tanpa ToyyibPay dan sebaliknya.
      - name: Pasang ke Cloudflare
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOYYIBPAY_SECRET: ${{ secrets.TOYYIBPAY_SECRET }}
          TOYYIBPAY_CATEGORY: ${{ secrets.TOYYIBPAY_CATEGORY }}
          LICENSE_PRIVATE_JWK: ${{ secrets.LICENSE_PRIVATE_JWK }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          npx --yes wrangler@3 deploy
          for n in TOYYIBPAY_SECRET TOYYIBPAY_CATEGORY LICENSE_PRIVATE_JWK AZURE_SPEECH_KEY AZURE_SPEECH_REGION; do
            v="${!n}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx --yes wrangler@3 secret put "$n"; fi
          done
