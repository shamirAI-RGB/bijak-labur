name: Pelayan pembayaran

# Uji pelayan pembayaran Premium, dan pasang ke Cloudflare Workers apabila rahsia telah ditetapkan.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.TOYYIBPAY_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uji
        run: node worker/test.mjs
      - name: Pasang ke Cloudflare
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            TOYYIBPAY_SECRET
            TOYYIBPAY_CATEGORY
            LICENSE_PRIVATE_JWK
        env:
          TOYYIBPAY_SECRET: ${{ secrets.TOYYIBPAY_SECRET }}
          TOYYIBPAY_CATEGORY: ${{ secrets.TOYYIBPAY_CATEGORY }}
          LICENSE_PRIVATE_JWK: ${{ secrets.LICENSE_PRIVATE_JWK }}
