# Pemantau Bijak Labur: semak kesihatan, uptime, prestasi, keselamatan dan penggunaan laman, pelayan dan perkhidmatan luar setiap jam.
# Kerosakan kritikal membuka (atau mengemas kini) satu issue berlabel "pantau"; issue ditutup sendiri apabila pulih.
# AI Agent harian membaca issue ini dan membaikinya melalui PR.
name: Pemantau

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    paths: ['scripts/pantau.mjs', '.github/workflows/pantau.yml']

permissions:
  contents: read
  issues: write

concurrency:
  group: pantau
  cancel-in-progress: false

jobs:
  pantau:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Sejarah uptime dan masa respons 30 hari (pantau-sejarah.json) disimpan antara larian
      - name: Sejarah uptime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: pantau-sejarah.json
          key: pantau-sejarah-${{ github.run_id }}
          restore-keys: pantau-sejarah-

      - name: Semak
        id: semak
        run: node scripts/pantau.mjs
        continue-on-error: true
        env:
          # Pilihan: statistik penggunaan dan ralat pelayan Workers (perlu kebenaran "Account Analytics: Read" pada token)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ringkasan
        if: always()
        run: cat pantau.md >> "$GITHUB_STEP_SUMMARY"

      - name: Buka, kemas kini atau tutup issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GAGAL: ${{ steps.semak.outcome == 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create pantau --color B60205 --description "Kerosakan dikesan oleh pemantau automatik" 2>/dev/null || true
          open=$(gh issue list --label pantau --state open --json number --jq '.[0].number')
          printf '\n[Log semakan](%s)\n' "$RUN_URL" >> pantau.md
          if [ "$GAGAL" = "true" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file pantau.md
            else
              gh issue create --label pantau --title "🔴 Pemantau: $(node -e "console.log(require('./pantau.json').kritikal.join(', ').slice(0,180))")" --body-file pantau.md
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "✅ Semua semakan kritikal kembali sihat. $RUN_URL"
          fi

      - name: Gagal jika PR merosakkan pemantau
        if: github.event_name == 'pull_request' && steps.semak.outcome == 'failure'
        run: echo "::warning::Pemantau melaporkan kerosakan (lihat ringkasan)."
