name: Pelayan Tanya AI Fiqh

# Uji pelayan Tanya AI Fiqh, dan pasang ke Cloudflare Workers apabila rahsia Cloudflare telah ditetapkan.
# Korpus rujukan dan senarai PDF rujukan moden datang daripada js/fiqh-data.js, jadi perubahan pada fail itu juga memasang semula pelayan.
on:
  push:
    branches: [main]
    paths: ['worker-fiqh/**', 'js/fiqh-data.js', '.github/workflows/fiqh.yml']
  pull_request:
    paths: ['worker-fiqh/**', 'js/fiqh-data.js', '.github/workflows/fiqh.yml']
  workflow_dispatch:
  # Seminggu sekali: teks kitab dalam actions/cache dipadam jika tidak digunakan 7 hari. Larian mingguan
  # mengekalkannya (dan memasang semula pelayan dengan indeks yang sama), supaya pemasangan seterusnya tidak
  # bermula semula dengan kitab yang separuh dimuat turun.
  schedule:
    - cron: '17 19 * * 0'

# Token GitHub hanya boleh membaca repo (prinsip keistimewaan minimum)
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker-fiqh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Uji
        run: node test.mjs
      # Teks kitab Shamela yang telah dimuat turun disimpan antara larian, supaya setiap halaman hanya diambil sekali
      - name: Cache teks kitab
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: worker-fiqh/.cache
          key: shamela-v1-${{ github.run_id }}
          restore-keys: shamela-v1-
      # Rujukan: muat turun 4 PDF rasmi moden dan teks kitab muktabar (Shamela), ambil teks setiap muka surat dan bina
      # indeks carian ke worker-fiqh/aset (tidak disimpan dalam repo). Dokumen yang gagal dimuat turun dilangkau.
      - name: Muat turun dan indeks rujukan
        timeout-minutes: 30
        continue-on-error: true
        run: node scripts/muat-rujukan.mjs
      - run: mkdir -p aset/rujukan
      # Edisi cetakan kitab: padankan halaman Shamela dengan muka surat PDF bergambar (archive.org) melalui OCR,
      # supaya Tanya AI boleh memberi muka surat PDF, penerbit dan edisi. Kitab tanpa padanan dilangkau.
      - name: Pasang OCR (poppler, tesseract Arab)
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ara > /dev/null
      - name: Padankan PDF cetakan kitab
        timeout-minutes: 30
        continue-on-error: true
        run: node scripts/padan-pdf.mjs
      # Semak kunci Gemini dan uji setiap model dengan permintaan Tanya AI sebenar (tanpa mendedahkan kunci)
      - name: Semak Gemini
        if: env.HAS_GEMINI == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          G=https://generativelanguage.googleapis.com/v1beta/models
          echo "Model Flash yang tersedia:"
          curl -sS "$G?pageSize=200" -H "x-goog-api-key: $GEMINI_API_KEY" | jq -r '.models[]?.name | select(test("flash"))' | head -30
          node diag.mjs
      # Studio Gambar: uji FLUX sebenar di Workers AI dengan akaun Cloudflare (satu gambar kecil, ~60 neuron)
      - name: Semak Workers AI (FLUX)
        if: env.HAS_CF == 'true'
        continue-on-error: true
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' \
            -d '{"prompt":"a cat eating nasi lemak on a banana leaf, watercolour","steps":4}' \
            | jq -r 'if .success then "FLUX berjaya: gambar \(.result.image | length) aksara base64" else "FLUX gagal: \(.errors | tostring)" end'
      # Cuba dengan domain fiqh.bijaklabur.my dahulu. Jika gagal, pasang ke alamat workers.dev sahaja.
      - name: Pasang ke Cloudflare (domain fiqh.bijaklabur.my)
        id: domain
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        continue-on-error: true
        run: npx --yes wrangler@3 deploy
      - name: Pasang ke Cloudflare (workers.dev sahaja)
        if: steps.domain.outcome == 'failure'
        run: |
          sed -i '/^routes = /d' wrangler.toml
          npx --yes wrangler@3 deploy
      # Kunci API dimuat naik hanya jika ia ditetapkan. Tanpa ANTHROPIC_API_KEY dan GEMINI_API_KEY, Tanya AI memaparkan "belum diaktifkan".
      - name: Rahsia ANTHROPIC_API_KEY
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@3 secret put ANTHROPIC_API_KEY; fi
      # Pilihan percuma: kunci Gemini (Google AI Studio). Digunakan jika ANTHROPIC_API_KEY tiada.
      - name: Rahsia GEMINI_API_KEY
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@3 secret put GEMINI_API_KEY; fi
      # Penghala AI (gaya 9Router): setiap kunci penyedia sandaran dimuat naik hanya jika ditetapkan dalam GitHub Secrets.
      # AI_COMBO (susunan, cth. "groq,cerebras") juga pilihan. Model boleh ditukar melalui <ID>_MODEL dalam [vars] wrangler.toml.
      - name: Rahsia penyedia AI sandaran
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          HYPERBOLIC_API_KEY: ${{ secrets.HYPERBOLIC_API_KEY }}
          CHUTES_API_KEY: ${{ secrets.CHUTES_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          QIANFAN_API_KEY: ${{ secrets.QIANFAN_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AI_COMBO: ${{ secrets.AI_COMBO }}
        run: |
          for k in GROQ_API_KEY CEREBRAS_API_KEY OPENROUTER_API_KEY NVIDIA_API_KEY MISTRAL_API_KEY ZAI_API_KEY SAMBANOVA_API_KEY KILO_API_KEY HF_TOKEN DEEPSEEK_API_KEY TOGETHER_API_KEY FIREWORKS_API_KEY NEBIUS_API_KEY SILICONFLOW_API_KEY FEATHERLESS_API_KEY HYPERBOLIC_API_KEY CHUTES_API_KEY COHERE_API_KEY DASHSCOPE_API_KEY MINIMAX_API_KEY HUNYUAN_API_KEY QIANFAN_API_KEY XAI_API_KEY OPENAI_API_KEY AI_GATEWAY_API_KEY OPENCODE_API_KEY AI_COMBO; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx --yes wrangler@3 secret put "$k" >/dev/null && echo "$k dimuat naik"; fi
          done
      # Uji pelayan sebenar (selepas dipasang di main; pada PR, uji versi yang sedang berjalan): Studio Gambar, Buku Nota, Kerjaya
      - name: Uji pelayan sebenar
        if: env.HAS_CF == 'true' && (github.ref != 'refs/heads/main' || steps.domain.outcome == 'success')
        continue-on-error: true
        run: |
          sleep 15
          # Log pelayan (wrangler tail) semasa ujian, untuk melihat punca ralat sebenar
          (timeout 60 npx --yes wrangler@3 tail --format json > tail.log 2>/dev/null &) ; sleep 8
          F=https://fiqh.bijaklabur.my; O='origin: https://bijaklabur.my'; C='content-type: application/json'
          curl -sS "$F/" | jq -c .   # termasuk senarai penyedia sandaran yang aktif
          curl -sS -X POST "$F/gambar" -H "$O" -H "$C" -d '{"prompt":"kucing comel makan nasi lemak atas daun pisang","gaya":"catair","seed":7}' \
            | jq -r 'if .image then "gambar OK: \(.image | length) aksara base64, prompt: \(.prompt_en[0:120])" else "gambar GAGAL: \(.error) [kod: \(.kod // "-")]" end'
          curl -sS -X POST "$F/buku" -H "$O" -H "$C" -d '{"tugas":"kad","sumber":[{"tajuk":"Bab 1","teks":"Fotosintesis ialah proses tumbuhan hijau menghasilkan makanan menggunakan cahaya matahari, air dan karbon dioksida. Proses ini berlaku dalam kloroplas dan membebaskan oksigen."}]}' \
            | jq -r 'if .kad then "buku OK: \(.kad | length) kad, contoh: \(.kad[0].depan) -> \(.kad[0].belakang)\(if .penghala then " (penghala)" else "" end)" else "buku GAGAL: \(.error)" end'
          curl -sS -X POST "$F/kerja" -H "$O" -H "$C" -d '{"tugas":"cadang","resume":"Graduan Ijazah Sarjana Muda Perakaunan UiTM 2025. Latihan industri 6 bulan di firma audit kecil: menyediakan penyata bank, lejar am dan cukai SST. Mahir Excel, SQL Account dan AutoCount. Bendahari persatuan pelajar."}' \
            | jq -r 'if .jawatan then "kerja OK: \([.jawatan[].tajuk] | join(", "))" else "kerja GAGAL: \(.error)" end'
          curl -sS -X POST "$F/tanya" -H "$O" -H "$C" -d '{"q":"Apakah hukum melabur dalam mata wang kripto seperti Bitcoin?"}' \
            | jq -r 'if .status then "tanya \(.status): \([.sumber[] | "\(.jenis)\(if .pdf then " hlm \(.pdf)" else "" end)\(if .disahkan then " (disahkan)" else "" end)"] | join(", "))" else "tanya GAGAL: \(.error)" end'
          sleep 5
          echo "--- Log pelayan ---"
          jq -r 'select(.logs) | .logs[] | .message | map(tostring) | join(" ")' tail.log 2>/dev/null | grep -v '^$' | head -40 || true
          jq -r 'select(.exceptions) | .exceptions[] | "PENGECUALIAN: \(.name): \(.message)"' tail.log 2>/dev/null | head -10 || true
      - name: Ringkasan
        if: github.ref == 'refs/heads/main'
        env:
          HAS_AI: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "$HAS_AI" != "true" ]; then
            echo "Tiada ANTHROPIC_API_KEY atau GEMINI_API_KEY, jadi Tanya AI memaparkan \"belum diaktifkan\"." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$HAS_CF" != "true" ]; then
            echo "Rahsia Cloudflare belum ditetapkan, jadi pelayan Tanya AI tidak dipasang." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.domain.outcome }}" = "success" ]; then
            echo "Pelayan Tanya AI dipasang di https://fiqh.bijaklabur.my" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Domain fiqh.bijaklabur.my belum boleh digunakan. Pelayan dipasang di alamat workers.dev; lihat log di atas untuk URL." >> "$GITHUB_STEP_SUMMARY"
          fi
