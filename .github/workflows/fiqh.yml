name: Pelayan Tanya AI Fiqh

# Uji pelayan Tanya AI Fiqh, dan pasang ke Cloudflare Workers apabila rahsia Cloudflare telah ditetapkan.
# Korpus rujukan datang daripada js/fiqh-data.js, jadi perubahan pada fail itu juga memasang semula pelayan.
on:
  push:
    branches: [main]
    paths: ['worker-fiqh/**', 'js/fiqh-data.js', '.github/workflows/fiqh.yml']
  pull_request:
    paths: ['worker-fiqh/**', 'js/fiqh-data.js', '.github/workflows/fiqh.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker-fiqh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Uji
        run: node test.mjs
      # Semak kunci Gemini dan uji setiap model dengan permintaan Tanya AI sebenar (tanpa mendedahkan kunci)
      - name: Semak Gemini
        if: env.HAS_GEMINI == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          G=https://generativelanguage.googleapis.com/v1beta/models
          echo "Model Flash yang tersedia:"
          curl -sS "$G?pageSize=200" -H "x-goog-api-key: $GEMINI_API_KEY" | jq -r '.models[]?.name | select(test("flash"))' | head -30
          node diag.mjs
      # Studio Gambar: uji FLUX sebenar di Workers AI dengan akaun Cloudflare (satu gambar kecil, ~60 neuron)
      - name: Semak Workers AI (FLUX)
        if: env.HAS_CF == 'true'
        continue-on-error: true
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' \
            -d '{"prompt":"a cat eating nasi lemak on a banana leaf, watercolour","steps":4,"seed":7}' \
            | jq -r 'if .success then "FLUX berjaya: gambar \(.result.image | length) aksara base64" else "FLUX gagal: \(.errors | tostring)" end'
      # Cuba dengan domain fiqh.bijaklabur.my dahulu. Jika gagal, pasang ke alamat workers.dev sahaja.
      - name: Pasang ke Cloudflare (domain fiqh.bijaklabur.my)
        id: domain
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        continue-on-error: true
        run: npx --yes wrangler@3 deploy
      - name: Pasang ke Cloudflare (workers.dev sahaja)
        if: steps.domain.outcome == 'failure'
        run: |
          sed -i '/^routes = /d' wrangler.toml
          npx --yes wrangler@3 deploy
      # Kunci API dimuat naik hanya jika ia ditetapkan. Tanpa ANTHROPIC_API_KEY dan GEMINI_API_KEY, Tanya AI memaparkan "belum diaktifkan".
      - name: Rahsia ANTHROPIC_API_KEY
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@3 secret put ANTHROPIC_API_KEY; fi
      # Pilihan percuma: kunci Gemini (Google AI Studio). Digunakan jika ANTHROPIC_API_KEY tiada.
      - name: Rahsia GEMINI_API_KEY
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@3 secret put GEMINI_API_KEY; fi
      - name: Ringkasan
        if: github.ref == 'refs/heads/main'
        env:
          HAS_AI: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "$HAS_AI" != "true" ]; then
            echo "Tiada ANTHROPIC_API_KEY atau GEMINI_API_KEY, jadi Tanya AI memaparkan \"belum diaktifkan\"." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$HAS_CF" != "true" ]; then
            echo "Rahsia Cloudflare belum ditetapkan, jadi pelayan Tanya AI tidak dipasang." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.domain.outcome }}" = "success" ]; then
            echo "Pelayan Tanya AI dipasang di https://fiqh.bijaklabur.my" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Domain fiqh.bijaklabur.my belum boleh digunakan. Pelayan dipasang di alamat workers.dev; lihat log di atas untuk URL." >> "$GITHUB_STEP_SUMMARY"
          fi
