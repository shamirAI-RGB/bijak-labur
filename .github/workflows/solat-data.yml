name: Data waktu solat

# Kemas kini fail sandaran waktu solat untuk laman web setiap bulan.
on:
  schedule:
    - cron: '0 18 25,28 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run solat-data
      - name: Simpan perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/solat
          git diff --cached --quiet || (git commit -m "Kemas kini data waktu solat" && git push)
