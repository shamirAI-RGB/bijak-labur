name: Pelayan kedai nota

# Uji pelayan kedai nota IC220, dan pasang ke Cloudflare Workers apabila rahsia Cloudflare telah ditetapkan.
on:
  push:
    branches: [main]
    paths: ['worker-nota/**', '.github/workflows/nota.yml']
  pull_request:
    paths: ['worker-nota/**', '.github/workflows/nota.yml']
  workflow_dispatch:

# Token GitHub hanya boleh membaca repo (prinsip keistimewaan minimum)
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Uji
        run: node worker-nota/test.mjs
      # Cari ruang nama KV "bijak-labur-nota", cipta jika belum ada, dan ikat sebagai NOTA.
      # Ruang nama yang sama digunakan semula setiap kali, jadi nota yang dimuat naik tidak hilang.
      - name: Sediakan storan KV
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces"
          id=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$api?per_page=100" | jq -r '.result[] | select(.title=="bijak-labur-nota") | .id' | head -1)
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"title":"bijak-labur-nota"}' "$api" | jq -r '.result.id')
          fi
          if [ -z "$id" ] || [ "$id" = "null" ]; then echo "::error::Tidak dapat mencipta ruang nama KV. Pastikan token Cloudflare ada kebenaran Workers KV Storage: Edit."; exit 1; fi
          printf '\n[[kv_namespaces]]\nbinding = "NOTA"\nid = "%s"\n' "$id" >> worker-nota/wrangler.toml
      # Cuba dengan domain nota.bijaklabur.my dahulu; jika gagal, pasang ke alamat workers.dev sahaja.
      - name: Pasang ke Cloudflare (domain nota.bijaklabur.my)
        id: domain
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker-nota
      - name: Pasang ke Cloudflare (workers.dev sahaja)
        if: steps.domain.outcome == 'failure'
        run: sed -i '/^routes = /d' worker-nota/wrangler.toml
      - if: steps.domain.outcome == 'failure'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker-nota
      - name: Ringkasan
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "$HAS_CF" != "true" ]; then
            echo "Rahsia CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID belum ditetapkan, jadi pelayan nota tidak dipasang." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.domain.outcome }}" = "success" ]; then
            echo "Pelayan nota dipasang di https://nota.bijaklabur.my" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Domain nota.bijaklabur.my belum boleh digunakan. Pelayan dipasang di alamat workers.dev; lihat log langkah di atas untuk URL." >> "$GITHUB_STEP_SUMMARY"
          fi
